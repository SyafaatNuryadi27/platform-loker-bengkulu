        .form-control {

<body>

    <!-- TOP HEADER -->

    <!-- FORM CONTAINER -->
    <main class="auth-wrapper">
        <section class="auth-card">
            <div class="brand-header">
                <div class="logo-icon"><i class="fa-solid fa-user-plus"></i></div>
                <h1>Buat Akun Baru Loker Bengkulu</h1>
                <p>Isi formulir pendaftaran untuk mulai menggunakan layanan Loker Bengkulu</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Nama Lengkap</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullName" class="form-control" placeholder="Contoh: Budi Pratama" required>
                        <i class="fa-regular fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Alamat Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="whatsapp">Nomor WhatsApp</label>
                    <div class="input-wrapper">
                        <input type="tel" id="whatsapp" class="form-control" placeholder="081234567890" inputmode="numeric" pattern="[0-9]*" minlength="10" required>
                        <i class="fa-brands fa-whatsapp input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="role">Jenis Akun</label>
                    <div class="input-wrapper">
                        <select id="role" class="form-control" required aria-label="Pilih Jenis Akun">
                            <option value="" disabled selected>Pilih Peran Anda</option>
                            <option value="pelamar">Pelamar Pekerjaan / Pencari Kerja</option>
                            <option value="perusahaan">Pemberi Kerja / Perusahaan</option>
                        </select>
                        <i class="fa-solid fa-user-gear input-icon"></i>
                        <i class="fa-solid fa-chevron-down select-arrow"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Kata Sandi</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" minlength="6" required>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword" title="Tampilkan/Sembunyikan Kata Sandi"></i>
                    </div>
                    <div class="strength-meter" id="strengthMeter">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="btnSubmit">
                    <i class="fa-solid fa-user-plus"></i> Daftar Sekarang
                </button>
            </form>

            <div id="msg" role="alert"></div>

            <div class="auth-footer">
                Sudah memiliki akun? <a href="login.html">Masuk di sini</a>
            </div>
        </section>
    </main>

    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCwc-W77xFztHROZEpvfK0nWZC2P9bNGOQ",
            authDomain: "platform-loker-bengkulu.firebaseapp.com",
            projectId: "platform-loker-bengkulu",
            storageBucket: "platform-loker-bengkulu.firebasestorage.app",
            messagingSenderId: "522033003669",
            appId: "1:522033003669:web:4ff46c3f27a8df48eeaf9c"
        };

        // Inisialisasi Firebase & Layanan
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById("registerForm");
        const msg = document.getElementById("msg");
        const btnSubmit = document.getElementById("btnSubmit");
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const strengthMeter = document.getElementById("strengthMeter");
        const strengthBar = document.getElementById("strengthBar");

        // Toggle Password Visibility
        togglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.getAttribute("type") === "password";
            passwordInput.setAttribute("type", isPassword ? "text" : "password");
            togglePassword.classList.toggle("fa-eye", !isPassword);
            togglePassword.classList.toggle("fa-eye-slash", isPassword);
        });

        // Password Strength Checker
        passwordInput.addEventListener("input", () => {
            const val = passwordInput.value;
            if (val.length === 0) {
                strengthMeter.style.display = "none";
                return;
            }
            strengthMeter.style.display = "block";

            let score = 0;
            if (val.length >= 6) score += 35;
            if (val.length >= 10) score += 25;
            if (/[A-Z]/.test(val)) score += 20;
            if (/[0-9]/.test(val)) score += 20;

            strengthBar.style.width = score + "%";
            if (score < 40) {
                strengthBar.style.backgroundColor = "var(--rose-500)";
            } else if (score < 75) {
                strengthBar.style.backgroundColor = "#f59e0b";
            } else {
                strengthBar.style.backgroundColor = "var(--emerald-500)";
            }
        });

        function showMessage(text, type) {
            msg.className = `show msg-${type}`;
            msg.innerText = text;
        }

        function formatWhatsappNumber(number) {
            let clean = number.replace(/\D/g, '');
            if (clean.startsWith('0')) {
                clean = '62' + clean.slice(1);
            }
            return clean;
        }

        // Form Submit Listener (Manual Registration)
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...`;
            showMessage("Memproses pendaftaran akun...", "info");

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const rawWhatsapp = document.getElementById("whatsapp").value.trim();
            const role = document.getElementById("role").value;
            const password = passwordInput.value;
            const formattedWhatsapp = formatWhatsappNumber(rawWhatsapp);

            try {
                // Register ke Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Simpan metadata ke Firestore pada dokumen users/{uid}
                if (user) {
                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        nama: fullName,
                        email: email,
                        whatsapp: formattedWhatsapp,
                        role: role,
                        createdAt: new Date().toISOString()
                    });
                }

                // Pelacakan Event Pendaftaran Berhasil di Google Analytics
                if (typeof gtag === 'function') {
                    gtag('event', 'sign_up', {
                        'method': 'Email',
                        'user_role': role
                    });
                }

                showMessage("Akun berhasil dibuat! Mengalihkan...", "success");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1200);

            } catch (err) {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-user-plus"></i> Daftar Sekarang`;
                
                if (err.code === "auth/email-already-in-use") {
                    showMessage("Email tersebut sudah terdaftar! Silakan gunakan email lain.", "error");
                } else if (err.code === "auth/weak-password") {
                    showMessage("Kata sandi terlalu lemah! Gunakan minimal 6 karakter.", "error");
                } else if (err.code === "auth/invalid-email") {
                    showMessage("Format email tidak valid!", "error");
                } else {
                    showMessage("Gagal mendaftar: " + (err.message || "Terjadi kesalahan"), "error");
                }
            }
        });
    </script>
