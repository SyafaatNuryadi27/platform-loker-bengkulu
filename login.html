<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Loker Bengkulu</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:#f4f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.card{
  width:100%;
  max-width:390px;
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.logo{
  text-align:center;
  margin-bottom:25px;
}
.logo h1{color:#111827;font-size:28px}
.logo p{color:#64748b;font-size:14px;margin-top:6px}
.input-group{margin-bottom:15px}
input{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  font-size:14px;
}
input:focus{border-color:#2563eb}
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
.btn:hover{background:#1d4ed8}
.divider{
  display:flex;
  align-items:center;
  margin:20px 0;
  color:#9ca3af;
  font-size:13px;
}
.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#e5e7eb;
}
.divider span{margin:0 12px}
.google-btn{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  cursor:pointer;
  font-weight:600;
}
.google-btn:hover{background:#f9fafb}
.link{
  text-align:center;
  margin-top:20px;
  font-size:14px;
}
.link a{
  color:#2563eb;
  text-decoration:none;
  font-weight:bold;
}
#msg{
  margin-top:12px;
  text-align:center;
  color:#dc2626;
  font-size:14px;
}
</style>
</head>
<body>

<div class="card">

  <div class="logo">
    <h1>Loker Bengkulu</h1>
    <p>Masuk ke akun Anda</p>
  </div>

  <form id="loginForm">
    <div class="input-group">
      <input type="email" id="email" placeholder="Email" required>
    </div>

    <div class="input-group">
      <input type="password" id="password" placeholder="Password" required>
    </div>

    <button class="btn" type="submit">Masuk</button>
  </form>

  <div class="divider">
    <span>ATAU</span>
  </div>

  <button class="google-btn" id="googleLogin">
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.3l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.5-6.2 7.1l6.2 5.2C39.2 36.7 44 30.8 44 24c0-1.2-.1-2.3-.4-3.5z"/>
    </svg>
    Masuk dengan Google
  </button>

  <div id="msg"></div>

  <div class="link">
    Belum punya akun?
    <a href="daftar.html">Daftar</a>
  </div>

</div>

<script type="module">
import { loginEmail, signInWithGoogle } from "./firebase.js";

const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.innerText = "Memproses masuk...";
  msg.style.color = "#2563eb";

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await loginEmail(email, password);
    window.location.href = "index.html";
  } catch (err) {
    msg.style.color = "#dc2626";
    msg.innerText = "Email atau password salah!";
  }
});

document.getElementById("googleLogin").addEventListener("click", async () => {
  try {
    await signInWithGoogle();
    window.location.href = "index.html";
  } catch (err) {
    msg.style.color = "#dc2626";
    msg.innerText = "Login Google dibatalkan";
  }
});
</script>


</body>
</html>
