    <style>

        .toggle-password {

            right: 0.9rem;

            cursor: pointer;
            padding: 0.2rem;
            background: none;
            border: none;
            outline: none;

        .form-control {

        /* BUTTONS */

            padding: 0.75rem 1rem;

            border: 1px solid transparent;

            transition: all 0.2s ease;

        .btn-primary {

            box-shadow: 0 3px 10px rgba(79, 70, 229, 0.25);

        .btn-google:hover {

        /* DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            margin: 1.25rem 0;
            color: var(--slate-400);
            font-size: 0.7rem;

        .divider::before, .divider::after {

        .divider span {

        /* FEEDBACK MESSAGE */
        #msg {

        #msg.show {

        .msg-error {

        .msg-success {

        }

        .msg-info {
            background: var(--brand-50);
            color: var(--brand-600);
            border: 1px solid var(--brand-100);
        }

        /* FOOTER */
        .auth-footer {
            text-align: center;

        .auth-footer a {
            color: var(--brand-500);
            text-decoration: none;

        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: var(--slate-400);
        }
    </style>
</head>
<body>

            </a>
            <div class="nav-title">Masuk ke Akun</div>
            <div style="width: 36px;"></div>
        </div>

    <main class="auth-wrapper">
        <section class="auth-card">
            <div class="brand-header">
                <div class="logo-icon"><i class="fa-solid fa-right-to-bracket"></i></div>
                <h1>Masuk Akun Loker Bengkulu</h1>
                <p>Masuk untuk mengelola profil dan informasi karir Anda</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Alamat Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>

                    </div>
                </div>

                <div class="form-group">
                    <div class="form-header-flex">
                        <label class="form-label" for="password">Kata Sandi</label>
                        <a href="#" id="btnForgotPassword" class="forgot-link">Lupa Kata Sandi?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Masukkan kata sandi Anda" required>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <button type="button" class="toggle-password" id="btnTogglePassword" aria-label="Tampilkan kata sandi">
                            <i class="fa-regular fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="btnSubmit">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
                </button>
            </form>

            <div class="divider"><span>ATAU MASUK DENGAN</span></div>

            <button id="googleLogin" class="btn btn-google" aria-label="Masuk Menggunakan Akun Google">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 2.9l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.3l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.5-6.2 7.1l6.2 5.2C39.2 36.7 44 30.8 44 24c0-1.2-.1-2.3-.4-3.5z"/>
                </svg>
                Google
            </button>

            <div id="msg" role="alert"></div>

            <div class="auth-footer">
                Belum memiliki akun? <a href="daftar.html">Daftar sekarang</a>
            </div>
        </section>

    <footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCwc-W77xFztHROZEpvfK0nWZC2P9bNGOQ",
            authDomain: "platform-loker-bengkulu.firebaseapp.com",
            projectId: "platform-loker-bengkulu",
            storageBucket: "platform-loker-bengkulu.firebasestorage.app",
            messagingSenderId: "522033003669",
            appId: "1:522033003669:web:4ff46c3f27a8df48eeaf9c"
        };

        // Inisialisasi Firebase & Layanan
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const form = document.getElementById("loginForm");
        const msg = document.getElementById("msg");
        const btnSubmit = document.getElementById("btnSubmit");
        const passwordInput = document.getElementById("password");
        const btnTogglePassword = document.getElementById("btnTogglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const btnForgotPassword = document.getElementById("btnForgotPassword");

        // Fitur Toggle Intip Password
        btnTogglePassword.addEventListener("click", (e) => {
            e.preventDefault();
            const isPassword = passwordInput.getAttribute("type") === "password";
            
            if (isPassword) {
                passwordInput.setAttribute("type", "text");
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.setAttribute("type", "password");
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        });

        function showMessage(text, type) {
            msg.className = `show msg-${type}`;
            msg.innerText = text;
        }

        // Penanganan Lupa Kata Sandi melalui SweetAlert2 & Firebase Reset
        btnForgotPassword.addEventListener("click", (e) => {
            e.preventDefault();
            Swal.fire({
                title: 'Lupa Kata Sandi?',
                text: 'Masukkan alamat email Anda yang terdaftar untuk menerima tautan pemulihan kata sandi.',
                input: 'email',
                inputPlaceholder: 'nama@email.com',
                showCancelButton: true,
                confirmButtonText: 'Kirim Tautan',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#4f46e5',
                showLoaderOnConfirm: true,
                preConfirm: async (emailVal) => {
                    if (!emailVal) {
                        Swal.showValidationMessage('Alamat email wajib diisi!');
                        return false;
                    }
                    try {
                        await sendPasswordResetEmail(auth, emailVal);
                        return emailVal;
                    } catch (error) {
                        let errorMsg = 'Gagal mengirim email pemulihan.';
                        if (error.code === 'auth/user-not-found') {
                            errorMsg = 'Email tidak ditemukan dalam sistem kami.';
                        } else if (error.code === 'auth/invalid-email') {
                            errorMsg = 'Format email tidak valid.';
                        }
                        Swal.showValidationMessage(errorMsg);
                    }
                },
                allowOutsideClick: () => !Swal.isLoading()
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Email Terkirim!',
                        text: `Instruksi pemulihan kata sandi telah dikirim ke ${result.value}. Silakan periksa kotak masuk atau folder spam Anda.`,
                        confirmButtonColor: '#4f46e5'
                    });
                }
            });
        });

        // Form Submit Login Email & Password
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...`;
            showMessage("Sedang memverifikasi akun...", "info");

            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                
                // Pelacakan Event Login Email di Google Analytics
                if (typeof gtag === 'function') {
                    gtag('event', 'login', {
                        'method': 'Email'
                    });
                }

                showMessage("Login berhasil! Mengalihkan...", "success");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            } catch (err) {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang`;
                
                if (err.code === "auth/invalid-credential" || err.code === "auth/user-not-found" || err.code === "auth/wrong-password") {
                    showMessage("Email atau kata sandi tidak cocok!", "error");
                } else if (err.code === "auth/too-many-requests") {
                    showMessage("Terlalu banyak percobaan gagal. Silakan coba lagi beberapa saat lagi.", "error");
                } else if (err.code === "auth/invalid-email") {
                    showMessage("Format email tidak valid!", "error");
                } else {
                    showMessage("Gagal masuk: " + (err.message || "Terjadi kesalahan"), "error");
                }
            }
        });

        // Google Login Listener
        document.getElementById("googleLogin").addEventListener("click", async () => {
            try {
                const userCredential = await signInWithPopup(auth, googleProvider);
                const user = userCredential.user;

                if (user) {
                    // Buat/pembaruan dokumen user jika belum ada
                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        nama: user.displayName || 'Pengguna',
                        email: user.email,
                        whatsapp: '',
                        role: 'pelamar',
                        createdAt: new Date().toISOString()
                    }, { merge: true });
                }

                // Pelacakan Event Login Google di Google Analytics
                if (typeof gtag === 'function') {
                    gtag('event', 'login', {
                        'method': 'Google'
                    });
                }

                window.location.href = "index.html";
            } catch (err) {
                if (err.code !== "auth/popup-closed-by-user") {
                    showMessage("Proses masuk melalui Google dibatalkan atau gagal.", "error");
                }
            }
        });
    </script>
