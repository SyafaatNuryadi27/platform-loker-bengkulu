<body>  

    <header>  
        <div class="navbar">  
            <a href="index.html" class="btn-back" title="Kembali Ke Beranda" aria-label="Kembali Ke Beranda">  
                <i class="fa-solid fa-arrow-left"></i>  
            </a>  
            <div class="nav-title">Masuk ke Akun</div>  
            <div style="width: 34px;"></div>  
        </div>  
    </header>  

    <main class="auth-wrapper">  
        <section class="auth-card">  
            <div class="brand-header">  
                <div class="logo-icon"><i class="fa-solid fa-right-to-bracket"></i></div>  
                <h1>Masuk ke Akun</h1>  
                <p>Masukkan informasi kredensial Anda untuk mengelola profil dan informasi karir.</p>  
            </div>  

            <form id="loginForm">  
                <div class="form-group">  
                    <label class="form-label" for="email">Alamat Email</label>  
                    <div class="input-wrapper">  
                        <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>  
                        <i class="fa-regular fa-envelope input-icon"></i>  
                    </div>  
                </div>  

                <div class="form-group">  
                    <div class="form-header-flex">  
                        <label class="form-label" for="password">Kata Sandi</label>  
                        <a href="#" id="btnForgotPassword" class="forgot-link">Lupa Kata Sandi?</a>  
                    </div>  
                    <div class="input-wrapper">  
                        <input type="password" id="password" class="form-control" placeholder="Masukkan kata sandi Anda" required>  
                        <i class="fa-solid fa-lock input-icon"></i>  
                        <button type="button" class="toggle-password" id="btnTogglePassword" aria-label="Tampilkan kata sandi">  
                            <i class="fa-regular fa-eye" id="eyeIcon"></i>  
                        </button>  
                    </div>  
                </div>  

                <button type="submit" class="btn btn-primary" id="btnSubmit">  
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang  
                </button>  
            </form>  

            <div id="msg" role="alert"></div>  

            <div class="auth-footer">  
                Belum memiliki akun? <a href="daftar.html">Daftar sekarang</a>  
            </div>  
        </section>  
    </main>  

    <footer>

    <script type="module">  
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";  
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";  

        const firebaseConfig = {  
            apiKey: "AIzaSyCwc-W77xFztHROZEpvfK0nWZC2P9bNGOQ",  
            authDomain: "platform-loker-bengkulu.firebaseapp.com",  
            projectId: "platform-loker-bengkulu",  
            storageBucket: "platform-loker-bengkulu.firebasestorage.app",  
            messagingSenderId: "522033003669",  
            appId: "1:522033003669:web:4ff46c3f27a8df48eeaf9c"  
        };  

        const app = initializeApp(firebaseConfig);  
        const auth = getAuth(app);  

        const form = document.getElementById("loginForm");  
        const msg = document.getElementById("msg");  
        const btnSubmit = document.getElementById("btnSubmit");  
        const passwordInput = document.getElementById("password");  
        const btnTogglePassword = document.getElementById("btnTogglePassword");  
        const eyeIcon = document.getElementById("eyeIcon");  
        const btnForgotPassword = document.getElementById("btnForgotPassword");  

        btnTogglePassword.addEventListener("click", (e) => {  
            e.preventDefault();  
            const isPassword = passwordInput.getAttribute("type") === "password";  
              
            if (isPassword) {  
                passwordInput.setAttribute("type", "text");  
                eyeIcon.classList.remove("fa-eye");  
                eyeIcon.classList.add("fa-eye-slash");  
            } else {  
                passwordInput.setAttribute("type", "password");  
                eyeIcon.classList.remove("fa-eye-slash");  
                eyeIcon.classList.add("fa-eye");  
            }  
        });  

        function showMessage(text, type) {  
            msg.className = `show msg-${type}`;  
            msg.innerText = text;  
        }  

        btnForgotPassword.addEventListener("click", (e) => {  
            e.preventDefault();  
            Swal.fire({  
                title: 'Lupa Kata Sandi?',  
                text: 'Masukkan alamat email Anda yang terdaftar untuk menerima tautan pemulihan kata sandi.',  
                input: 'email',  
                inputPlaceholder: 'nama@email.com',  
                showCancelButton: true,  
                confirmButtonText: 'Kirim Tautan',  
                cancelButtonText: 'Batal',  
                confirmButtonColor: '#1b365d',  
                showLoaderOnConfirm: true,  
                preConfirm: async (emailVal) => {  
                    if (!emailVal) {  
                        Swal.showValidationMessage('Alamat email wajib diisi!');  
                        return false;  
                    }  
                    try {  
                        await sendPasswordResetEmail(auth, emailVal);  
                        return emailVal;  
                    } catch (error) {  
                        let errorMsg = 'Gagal mengirim email pemulihan.';  
                        if (error.code === 'auth/user-not-found') {  
                            errorMsg = 'Email tidak ditemukan dalam sistem kami.';  
                        } else if (error.code === 'auth/invalid-email') {  
                            errorMsg = 'Format email tidak valid.';  
                        }  
                        Swal.showValidationMessage(errorMsg);  
                    }  
                },  
                allowOutsideClick: () => !Swal.isLoading()  
            }).then((result) => {  
                if (result.isConfirmed) {  
                    Swal.fire({  
                        icon: 'success',  
                        title: 'Email Terkirim!',  
                        text: `Instruksi pemulihan kata sandi telah dikirim ke ${result.value}. Silakan periksa kotak masuk atau folder spam Anda.`,  
                        confirmButtonColor: '#1b365d'  
                    });  
                }  
            });  
        });  

        form.addEventListener("submit", async (e) => {  
            e.preventDefault();  
              
            btnSubmit.disabled = true;  
            btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...`;  
            showMessage("Sedang memverifikasi akun...", "info");  

            const email = document.getElementById("email").value.trim();  
            const password = passwordInput.value;  

            try {  
                await signInWithEmailAndPassword(auth, email, password);  
                  
                if (typeof gtag === 'function') {  
                    gtag('event', 'login', {  
                        'method': 'Email'  
                    });  
                }  

                showMessage("Login berhasil! Mengalihkan...", "success");  
                setTimeout(() => {  
                    window.location.href = "index.html";  
                }, 1000);  
            } catch (err) {  
                btnSubmit.disabled = false;  
                btnSubmit.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang`;  
                  
                if (err.code === "auth/invalid-credential" || err.code === "auth/user-not-found" || err.code === "auth/wrong-password") {  
                    showMessage("Email atau kata sandi tidak cocok!", "error");  
                } else if (err.code === "auth/too-many-requests") {  
                    showMessage("Terlalu banyak percobaan gagal. Silakan coba lagi beberapa saat lagi.", "error");  
                } else if (err.code === "auth/invalid-email") {  
                    showMessage("Format email tidak valid!", "error");  
                } else {  
                    showMessage("Gagal masuk: " + (err.message || "Terjadi kesalahan"), "error");  
                }  
            }  
        });  
    </script>
