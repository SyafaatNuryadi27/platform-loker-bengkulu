<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pasang Biodata Pelamar - Loker Bengkulu</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --brand-50: #eef2ff;
            --brand-100: #e0e7ff;
            --brand-500: #4f46e5;
            --brand-600: #4338ca;
            --brand-700: #3730a3;
            --emerald-500: #10b981;
            --emerald-50: #ecfdf5;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            --radius-app: 24px;
            --radius-card: 16px;
            --radius-input: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f8fafc;
            color: var(--slate-800);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 84px; /* Space for Bottom Nav */
        }

        /* Top App Bar */
        .app-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--slate-200);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.85rem 0;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 0 1.25rem;
            width: 100%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
            color: white;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--slate-900);
            letter-spacing: -0.4px;
        }

        .logo-text span {
            color: var(--brand-500);
        }

        .btn-header-action {
            background: var(--slate-100);
            border: none;
            color: var(--slate-700);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-header-action:hover {
            background: var(--slate-200);
        }

        /* App Content */
        main {
            flex: 1;
            padding: 1.25rem 0;
        }

        /* Card Structure */
        .app-card {
            background: white;
            border-radius: var(--radius-app);
            padding: 1.75rem 1.5rem;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--slate-200);
        }

        .card-hero {
            background: linear-gradient(135deg, var(--brand-50), #f0f7ff);
            border-radius: var(--radius-card);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--brand-100);
            position: relative;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--emerald-50);
            color: #047857;
            border: 1px solid #a7f3d0;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.725rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge .dot {
            width: 6px;
            height: 6px;
            background-color: var(--emerald-500);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .card-hero h2 {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--slate-900);
            letter-spacing: -0.3px;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-hero h2 i {
            color: var(--brand-500);
        }

        .card-hero p {
            font-size: 0.825rem;
            color: var(--slate-600);
            line-height: 1.45;
            font-weight: 500;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--slate-700);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: var(--slate-400);
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-icon-textarea {
            top: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--slate-900);
            background: var(--slate-50);
            border: 1px solid var(--slate-200);
            border-radius: var(--radius-input);
            outline: none;
            transition: all 0.2s ease;
        }

        textarea.form-control {
            padding-top: 0.75rem;
            resize: vertical;
            min-height: 110px;
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.1rem;
            padding-right: 2.5rem;
            cursor: pointer;
        }

        .form-control:focus {
            background: white;
            border-color: var(--brand-500);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .form-control:focus ~ .input-icon {
            color: var(--brand-500);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
        }

        /* Action Button */
        .btn-submit {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius-input);
            font-size: 0.9rem;
            font-weight: 700;
            background: var(--brand-500);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: var(--brand-600);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* Desktop Footer */
        .desktop-footer {
            text-align: center;
            padding: 1.25rem 0;
            font-size: 0.775rem;
            color: var(--slate-500);
            font-weight: 500;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--slate-200);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--slate-400);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            gap: 3px;
            width: 25%;
            height: 100%;
            transition: color 0.2s;
        }

        .nav-item i {
            font-size: 1.15rem;
            transition: transform 0.2s;
        }

        .nav-item.active {
            color: var(--brand-500);
            font-weight: 700;
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        @media (min-width: 640px) {
            body {
                padding-bottom: 2rem;
            }
            .form-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.15rem;
            }
            .bottom-nav {
                display: none;
            }
            .app-card {
                padding: 2.25rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header App Bar -->
    <header class="app-header">
        <div class="container navbar">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-briefcase"></i></div>
                <div class="logo-text">loker<span>bengkulu</span></div>
            </a>
            <a href="index.html" class="btn-header-action" title="Kembali ke Beranda">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="app-card">
                <!-- Hero Banner -->
                <div class="card-hero">
                    <div class="status-badge">
                        <span class="dot"></span> Mode Pelamar Aktif
                    </div>
                    <h2><i class="fa-solid fa-id-card"></i> Pasang Biodata Pelamar</h2>
                    <p>Lengkapi profil Anda agar perusahaan dan pemberi kerja di Bengkulu dapat menemukan serta menghubungi Anda langsung via WhatsApp.</p>
                </div>

                <form id="biodataForm">
                    <div class="form-group">
                        <label for="nama" class="form-label">Nama Lengkap</label>
                        <div class="input-wrapper">
                            <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama lengkap Anda" required>
                            <i class="fa-regular fa-user input-icon"></i>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="posisi" class="form-label">Minat Posisi Pekerjaan</label>
                            <div class="input-wrapper">
                                <input type="text" id="posisi" name="posisi" class="form-control" placeholder="Contoh: Admin / Kasir / Driver" required>
                                <i class="fa-solid fa-user-tag input-icon"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="pendidikan" class="form-label">Pendidikan Terakhir</label>
                            <div class="input-wrapper">
                                <select id="pendidikan" name="pendidikan" class="form-control" required>
                                    <option value="" disabled selected>Pilih Pendidikan</option>
                                    <option value="SMA / SMK">SMA / SMK</option>
                                    <option value="D3 / D4">D3 / D4</option>
                                    <option value="S1 / S2">S1 / S2</option>
                                </select>
                                <i class="fa-solid fa-graduation-cap input-icon"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="lokasi" class="form-label">Domisili / Tempat Tinggal</label>
                            <div class="input-wrapper">
                                <input type="text" id="lokasi" name="lokasi" class="form-control" placeholder="Contoh: Ratu Samban, Kota Bengkulu" required>
                                <i class="fa-solid fa-location-dot input-icon"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="pengalaman" class="form-label">Pengalaman Kerja</label>
                            <div class="input-wrapper">
                                <input type="text" id="pengalaman" name="pengalaman" class="form-control" placeholder="Contoh: Fresh Graduate / 1 Thn Admin" required>
                                <i class="fa-solid fa-briefcase input-icon"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="whatsapp" class="form-label">Nomor WhatsApp Aktif</label>
                        <div class="input-wrapper">
                            <input type="tel" id="whatsapp" name="whatsapp" class="form-control" placeholder="Contoh: 081234567890" required>
                            <i class="fa-brands fa-whatsapp input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="deskripsi" class="form-label">Ringkasan Keahlian & Profil</label>
                        <div class="input-wrapper">
                            <textarea id="deskripsi" name="deskripsi" class="form-control" placeholder="Jelaskan secara singkat latar belakang, keahlian utama, dan kualifikasi Anda..." required></textarea>
                            <i class="fa-solid fa-pen-to-square input-icon input-icon-textarea"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="btnSubmit">
                        <i class="fa-solid fa-paper-plane"></i> Simpan & Tampilkan Biodata
                    </button>
                </form>
            </div>

            <div class="desktop-footer">
                &copy; 2026 <strong>lokerbengkulu.my.id</strong> &bull; Portal Resmi Ketenagakerjaan
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar (Mobile View) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Beranda</span>
        </a>
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Cari Loker</span>
        </a>
        <a href="pasang-biodata.html" class="nav-item active">
            <i class="fa-solid fa-id-card"></i>
            <span>Biodata</span>
        </a>
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-building"></i>
            <span>Pasang Loker</span>
        </a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCwc-W77xFztHROZEpvfK0nWZC2P9bNGOQ",
            authDomain: "platform-loker-bengkulu.firebaseapp.com",
            projectId: "platform-loker-bengkulu",
            storageBucket: "platform-loker-bengkulu.firebasestorage.app",
            messagingSenderId: "522033003669",
            appId: "1:522033003669:web:4ff46c3f27a8df48eeaf9c"
        };

        // Inisialisasi Firebase & Layanan
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById("biodataForm");
        const btnSubmit = document.getElementById("btnSubmit");
        let currentUser = null;

        // Cek Autentikasi Pengguna saat Halaman Dimuat
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Akses Terbatas',
                    text: 'Anda harus masuk ke akun Anda terlebih dahulu untuk memasang biodata.',
                    confirmButtonText: 'Masuk Sekarang',
                    confirmButtonColor: '#4f46e5',
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = 'login.html';
                });
            } else {
                currentUser = user;
                // Auto-fill jika nama pengguna sudah tersedia
                if (user.displayName) {
                    document.getElementById("nama").value = user.displayName;
                }
            }
        });

        function formatWhatsappNumber(number) {
            let clean = number.replace(/\D/g, '');
            if (clean.startsWith('0')) {
                clean = '62' + clean.slice(1);
            }
            return clean;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Menyimpan...`;

            try {
                const rawWa = document.getElementById("whatsapp").value.trim();
                const formattedWa = formatWhatsappNumber(rawWa);

                await addDoc(collection(db, "biodata_pelamar"), {
                    uid: currentUser ? currentUser.uid : '',
                    nama: document.getElementById("nama").value.trim(),
                    posisi: document.getElementById("posisi").value.trim(),
                    pendidikan: document.getElementById("pendidikan").value,
                    lokasi: document.getElementById("lokasi").value.trim(),
                    pengalaman: document.getElementById("pengalaman").value.trim(),
                    whatsapp: formattedWa,
                    deskripsi: document.getElementById("deskripsi").value.trim(),
                    createdAt: new Date().toISOString()
                });

                Swal.fire({
                    icon: 'success',
                    title: 'Biodata Berhasil Disimpan!',
                    text: 'Profil Anda telah aktif dan dapat dilihat oleh perusahaan/pemberi kerja.',
                    confirmButtonColor: '#4f46e5'
                }).then(() => {
                    window.location.href = 'index.html';
                });
            } catch (error) {
                console.error("Gagal menyimpan biodata:", error);
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal Menyimpan',
                    text: 'Terjadi kesalahan saat menyimpan data. Silakan coba lagi.',
                    confirmButtonColor: '#4f46e5'
                });
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Simpan & Tampilkan Biodata`;
            }
        });
    </script>
</body>
</html>
