<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasang Biodata Pelamar - Loker Bengkulu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --accent-hover: #1d4ed8; --bg: #f8fafc; --card-bg: #ffffff; --text-main: #334155; --text-muted: #64748b; --border: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #ffffff; border-bottom: 1px solid var(--border); padding: 1rem 0; }
        .container { max-width: 700px; margin: 0 auto; padding: 0 1.5rem; }
        .navbar { display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .logo-icon { background-color: var(--primary); color: white; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1rem; }
        .logo-text { font-size: 1.15rem; font-weight: 700; color: var(--primary); letter-spacing: -0.3px; }
        .btn-back { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.45rem 0.9rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; transition: all 0.2s; }
        .btn-back:hover { background: #f1f5f9; color: var(--primary); }
        main { flex: 1; padding: 2.5rem 0; }
        .form-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03); }
        .form-header { margin-bottom: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .form-header h2 { font-size: 1.35rem; font-weight: 700; color: var(--primary); margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.6rem; }
        .form-header p { font-size: 0.875rem; color: var(--text-muted); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.825rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--primary); }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.7rem 0.85rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.875rem; outline: none; background: #f8fafc; transition: all 0.2s; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .form-row { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .btn-submit { background-color: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; width: 100%; transition: background 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; }
        .btn-submit:hover { background-color: var(--accent-hover); }
        footer { background: white; border-top: 1px solid var(--border); padding: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-muted); }
        @media (min-width: 640px) { .form-row { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="fa-solid fa-briefcase"></i></div>
                <div class="logo-text">lokerbengkulu.my.id</div>
            </a>
            <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
        </div>
    </header>

    <main class="container">
        <div class="form-card">
            <div class="form-header">
                <h2><i class="fa-solid fa-id-card text-blue-600"></i> Pasang Biodata Pelamar</h2>
                <p>Isi data profil Anda agar pemberi kerja di Bengkulu dapat menemukan dan menghubungi Anda secara langsung.</p>
            </div>

            <form id="biodataForm">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Minat Posisi Pekerjaan</label>
                        <input type="text" id="posisi" placeholder="Contoh: Admin / Kasir / Driver" required>
                    </div>

                    <div class="form-group">
                        <label>Pendidikan Terakhir</label>
                        <select id="pendidikan" required>
                            <option value="">Pilih Pendidikan</option>
                            <option>SMA / SMK</option>
                            <option>D3 / D4</option>
                            <option>S1 / S2</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Domisili / Lokasi Tempat Tinggal</label>
                        <input type="text" id="lokasi" placeholder="Contoh: Ratu Samban, Kota Bengkulu" required>
                    </div>

                    <div class="form-group">
                        <label>Pengalaman Kerja</label>
                        <input type="text" id="pengalaman" placeholder="Contoh: Fresh Graduate / 1 Tahun Admin" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nomor WhatsApp Aktif</label>
                    <input type="tel" id="whatsapp" placeholder="Contoh: 081234567890" required>
                </div>

                <div class="form-group">
                    <label>Ringkasan Keahlian & Deskripsi Diri</label>
                    <textarea id="deskripsi" rows="4" placeholder="Jelaskan secara singkat latar belakang dan keahlian utama yang Anda miliki..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <i class="fa-solid fa-paper-plane"></i> Simpan & Tampilkan Biodata
                </button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 lokerbengkulu.my.id &bull; Portal Informasi Ketenagakerjaan Resmi.</p>
    </footer>

    <script type="module">
        import { tambahData } from "./firebase.js";

        const form = document.getElementById("biodataForm");
        const btnSubmit = document.getElementById("btnSubmit");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

            try {
                let wa = document.getElementById("whatsapp").value.trim();
                if(wa.startsWith("0")) wa = "62" + wa.substring(1);

                await tambahData("biodata_pelamar", {
                    nama: document.getElementById("nama").value,
                    posisi: document.getElementById("posisi").value,
                    pendidikan: document.getElementById("pendidikan").value,
                    lokasi: document.getElementById("lokasi").value,
                    pengalaman: document.getElementById("pengalaman").value,
                    whatsapp: wa,
                    deskripsi: document.getElementById("deskripsi").value
                });

                alert('Sukses! Biodata Anda telah disimpan ke Firestore dan tampil di beranda.');
                window.location.href = 'index.html';
            } catch (error) {
                console.error(error);
                alert('Gagal menyimpan biodata. Silakan coba lagi.');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Simpan & Tampilkan Biodata`;
            }
        });
    </script>
</body>
</html>
